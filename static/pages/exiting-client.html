<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin IAM Dashboard - Exiting Client</title>
    <link rel="stylesheet" href="../css/exiting-client.css" />
  </head>
  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="menu">
        <h1>Admin IAM Users/Groups</h1>
        <nav class="menu">
          <a href="index.html">Home</a>
          <a href="user-groups.html">Users/Groups</a>
          <a href="casual-dashboard.html">Create/Delete</a>
          <a href="policies.html">Policies</a>
          <a href="alerts.html">Alerts</a>
          <a href="login.html">Log Out</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <input type="text" placeholder="Search..." />
        </header>

        <section class="form-section">
          <div class="form-header">
            <h3>Exiting Client</h3>
          </div>

          <form class="exit-form">
            <div class="form-row">
              <label for="exitDate">Exit Date</label>
              <input type="date" id="exitDate" required />
            </div>

            <div class="form-row">
              <label for="exitReason">Reason for Exit</label>
              <select id="exitReason" required>
                <option value="">Select reason...</option>
                <option value="deceased">Deceased</option>
                <option value="transferred">
                  Transferred to Another Facility
                </option>
                <option value="discharged">Discharged - Returned Home</option>
                <option value="family">Family Request</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-row">
              <label for="exitNotes">Additional Notes</label>
              <textarea id="exitNotes" rows="3"></textarea>
            </div>

            <div class="data-options">
              <div class="data-header">
                <h4>Data Handling Options</h4>
              </div>
              <div class="option-row">
                <label>
                  <input
                    type="radio"
                    name="dataOption"
                    value="retain"
                    checked
                  />
                  Retain data for regulatory period (7 years)
                </label>
              </div>
              <div class="option-row">
                <label>
                  <input type="radio" name="dataOption" value="archive" />
                  Archive data (limited access)
                </label>
              </div>
              <div class="option-row">
                <label>
                  <input type="radio" name="dataOption" value="deidentify" />
                  De-identify personal information
                </label>
              </div>
            </div>

            <div class="action-buttons">
              <button type="submit" class="process-btn">Process Exit</button>
              <button type="button" class="cancel-btn">Cancel</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <!-- Core API wrapper -->
    <script type="module" src="../js/api.js"></script>
    <!-- Exiting client logic -->
    <script type="module" src="../js/exiting-client.js"></script>
  </body>
</html>
